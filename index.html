<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Portfolio | Azure Specialist</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
            --success: #22c55e;
        }  
        </style>
</head>
<body>
    <div class="container">
        <span class="status-badge">Azure Static Web App • Live</span>
        <h1>Cloud Engineer Portfolio</h1>
        <p>This project demonstrates a full CI/CD pipeline using <strong>GitHub Actions</strong> and <strong>Azure Managed Functions</strong>.</p>
        
        <hr style="border: 0; border-top: 1px solid #334155; margin: 2rem 0;">
        
        <h3>Test API Connectivity</h3>
        <p style="font-size: 0.9rem; color: #94a3b8;">Enter your name to trigger the serverless backend:</p>
        
        <input type="text" id="nameBox" placeholder="Your Name">
        <button onclick="callApi()">Execute Azure Function</button>
        
        <div id="apiResponse">Ready for request...</div>
    </div>

    <script>
        async function callApi() {
            const responseContainer = document.getElementById('apiResponse');
            const name = document.getElementById('nameBox').value;
            responseContainer.innerText = "Sending to Azure...";
            try {
                const response = await fetch('/api/ContactForm', {
                    method: 'POST',
                    body: JSON.stringify({ name: name }),
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.text();
                responseContainer.innerText = data;
            } catch (err) {
                responseContainer.innerText = "Error connecting to API.";
            }
        }
    </script>
</body>
</html>
